[project]
name = "noolu-api"
version = "0.0.0"
description = "Deterministic image-to-metro processing API for Noolu Pidichaal Mathi."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<10",
]
